<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Courses Catalog</title>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <div class="header__logo">Courses</div>
      <nav class="header__nav"></nav>
    </div>
  </header>

  <main class="main">
    <section class="catalog">
      <div class="catalog__top">
        <div class="search">
          <input class="search__input" type="text" placeholder="Search courses..." />
          <span class="search__icon"></span>
        </div>
        <div class="filters">
          <button class="filters__item filters__item--active" data-category="all">All</button>
          <button class="filters__item" data-category="marketing">Marketing</button>
          <button class="filters__item" data-category="management">Management</button>
          <button class="filters__item" data-category="hr">HR &amp; Recruiting</button>
          <button class="filters__item" data-category="design">Design</button>
          <button class="filters__item" data-category="development">Development</button>
        </div>
      </div>

      <div class="catalog__grid" id="catalog-grid"></div>

      <div class="catalog__footer">
        <button class="load-more" id="load-more">
          <span>Load more</span>
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
