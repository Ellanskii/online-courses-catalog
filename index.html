<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Courses Catalog</title>
</head>
<body>
  <main class="catalog">

    <header class="catalog__header">
      <p class="catalog__subtitle">Enjoy your studying!</p>
      <h1 class="catalog__title">Our online courses</h1>
    </header>

    <div class="catalog__controls">
      <nav class="filters" aria-label="Course categories">
        <button class="filters__item filters__item--active" data-category="all">
          All<sup class="filters__count"></sup>
        </button>
        <button class="filters__item" data-category="marketing">
          Marketing<sup class="filters__count"></sup>
        </button>
        <button class="filters__item" data-category="management">
          Management<sup class="filters__count"></sup>
        </button>
        <button class="filters__item" data-category="hr">
          HR &amp; Recruiting<sup class="filters__count"></sup>
        </button>
        <button class="filters__item" data-category="design">
          Design<sup class="filters__count"></sup>
        </button>
        <button class="filters__item" data-category="development">
          Development<sup class="filters__count"></sup>
        </button>
      </nav>

      <div class="search">
        <input class="search__input" type="text" placeholder="Search course..." aria-label="Search courses" />
        <span class="search__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="catalog__grid" id="catalog-grid"></div>

    <div class="catalog__footer">
      <button class="load-more" id="load-more">
        <svg class="load-more__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>Load more</span>
      </button>
    </div>

  </main>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
